name: Publish npm release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version already reviewed and committed in package.json
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    environment: npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check release identity
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/check-release.mjs
      - run: npm run check
      - run: node dist/cli.js --json verify
      - run: npm pack --ignore-scripts
      - name: Publish the verified package with OIDC
        run: npm publish "agent-depot-$(node -p 'JSON.parse(require("fs").readFileSync("package.json")).version').tgz" --access public --provenance --ignore-scripts
